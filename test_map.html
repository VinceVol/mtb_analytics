<!DOCTYPE html>
<html>
<head>
    <title>GPS Map Track</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        
        /* Custom clean text badge styling */
        .map-label-badge {
            background-color: #1e293b;
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 6px;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            border: 1px solid #475569;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        const map = L.map('map');

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles © Esri'
        }).addTo(map);

        const trackData = {"type":"FeatureCollection","features":[]};
        const layer = L.geoJSON(trackData, {
            style: feature => ({
                color: feature.properties.stroke || '#FF0000',
                weight: 6,
                opacity: 0.9
            }),
            pointToLayer: (feature, latlng) => {
                if (feature.properties && feature.properties.label) {
                    const labelIcon = L.divIcon({
                        className: 'custom-map-label',
                        html: `<div class="map-label-badge">${feature.properties.label}</div>`,
                        iconSize: null
                    });
                    return L.marker(latlng, { icon: labelIcon });
                }
                return L.marker(latlng);
            },
            onEachFeature: (feature, layer) => {
                if (feature.properties && feature.properties["speed"] !== undefined) {
                    layer.bindPopup("speed: " + feature.properties["speed"]);
                }
            }
        }).addTo(map);

        map.fitBounds(layer.getBounds());
    </script>
</body>
</html>
